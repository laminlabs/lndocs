[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "lndocs"
authors = [{name = "Lamin Labs", email = "laminlabs@gmail.com"}]
readme = "README.md"
dynamic = ["version", "description"]
dependencies = [
    "dirsync",
    "myst-parser",
    "myst-nb",
    "sphinx>6,<7.4",
    "sphinxext-opengraph",
    "sphinx-autodoc-typehints>=2.1.0",
    "docutils",
    "pydata-sphinx-theme==0.12.0",
    "markdown",
    "sphinx_toolbox",
    "sphinx-design>=0.6.0",  # dropdowns etc.
    "sphinxcontrib-jquery",
    "sphinx-copybutton",
]

[project.urls]
Home = "https://github.com/laminlabs/lndocs"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "nox",
    "pytest>=6.0",
]
blog = [
    "ablog==0.10.25",  # this is only because sometime around 0.10.28 the author ordering on summary pages changed
]

[project.scripts]
lndocs = "lndocs.__main__:main"

[tool.black]
preview = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
