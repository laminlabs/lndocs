<script>
  /*******************************************************************************
   * Theme interaction
   */

  var prefersDark = window.matchMedia("(prefers-color-scheme: dark)");

  /**
   * set the the body theme to the one specified by the user browser
   * @param {event} e
   */
  function autoTheme(e) {
    document.documentElement.dataset.theme = prefersDark.matches
      ? "dark"
      : "light";
  }

  /**
   * Set the theme using the specified mode.
   * It can be one of ["auto", "dark", "light"]
   * @param {str} mode
   */
  function setTheme(mode) {
    if (mode !== "light" && mode !== "dark" && mode !== "auto") {
      console.error(`Got invalid theme mode: ${mode}. Resetting to auto.`);
      mode = "auto";
    }

    // get the theme
    var colorScheme = prefersDark.matches ? "dark" : "light";
    document.documentElement.dataset.mode = mode;
    var theme = mode == "auto" ? colorScheme : mode;
    document.documentElement.dataset.theme = theme;

    // save mode and theme
    localStorage.setItem("mode", mode);
    localStorage.setItem("theme", theme);
    console.log(`Changed to ${mode} mode using the ${theme} theme.`);

    // add a listener if set on auto
    prefersDark.onchange = mode == "auto" ? autoTheme : "";
  }
  function mycycleMode() {
    const defaultMode = document.documentElement.dataset.defaultMode || "auto";
    const currentMode = localStorage.getItem("mode") || defaultMode;

    var loopArray = (arr, current) => {
      var nextPosition = arr.indexOf(current) + 1;
      if (nextPosition === arr.length) {
        nextPosition = 0;
      }
      return arr[nextPosition];
    };

    // make sure the next theme after auto is always a change
    var modeList = prefersDark.matches ? ["dark", "light"] : ["light", "dark"];
    var newMode = loopArray(modeList, currentMode);
    setTheme(newMode);
  }
  /**
   * add the theme listener on the btns of the navbar
   */
  function addModeListener() {
    // the theme was set a first time using the initial mini-script
    // running setMode will ensure the use of the dark mode if auto is selected
    setTheme(document.documentElement.dataset.mode);

    // Attach event handlers for toggling themes colors
    const btn = document.getElementById("my-theme-switch");
    if (btn != null) {
      btn.addEventListener("click", mycycleMode);
    }
  }
  addModeListener();
</script>

<script data-no-instant>
  // sphinxcontrib-mermaid renders from a type="module" script on window
  // "load". InstantClick swaps the body and reinserts scripts without copying
  // type="module", so that script never runs and "load" does not fire again.
  var laminMermaidUrl = {{ mermaid_browser_url_json|safe }};
  var laminMermaidInit = {{ mermaid_init_config_json|safe }};
  var laminMermaidLight = {{ mermaid_light_theme_json|safe }};
  var laminMermaidDark = {{ mermaid_dark_theme_json|safe }};
  var laminMermaidLoader;

  function laminLoadMermaid() {
    if (!laminMermaidLoader) {
      laminMermaidLoader = import(laminMermaidUrl).then(function (mod) {
        return mod.default;
      });
    }
    return laminMermaidLoader;
  }

  function laminRenderMermaid() {
    var pending = Array.prototype.filter.call(
      document.querySelectorAll(".mermaid"),
      function (el) {
        return el.getAttribute("data-processed") !== "true";
      }
    );
    if (!pending.length) return;
    laminLoadMermaid()
      .then(function (mermaid) {
        var dark = document.documentElement.dataset.theme === "dark";
        var config = Object.assign({}, laminMermaidInit, {
          darkMode: dark,
          theme: dark ? laminMermaidDark : laminMermaidLight,
        });
        mermaid.initialize(config);
        var visible = [];
        var hidden = [];
        pending.forEach(function (el) {
          if (el.offsetParent !== null || el.getClientRects().length > 0) {
            visible.push(el);
          } else {
            hidden.push(el);
          }
        });
        var jobs = [];
        if (visible.length) jobs.push(mermaid.run({ nodes: visible }));
        if (hidden.length && typeof IntersectionObserver !== "undefined") {
          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return;
              if (entry.target.getAttribute("data-processed") === "true") return;
              observer.unobserve(entry.target);
              mermaid.run({ nodes: [entry.target] }).catch(function (err) {
                console.error("Mermaid rendering failed:", err);
              });
            });
          });
          hidden.forEach(function (el) {
            observer.observe(el);
          });
        }
        return Promise.all(jobs);
      })
      .catch(function (err) {
        console.error("Mermaid rendering failed:", err);
      });
  }

  InstantClick.on("receive", function (url, body) {
    var scripts = body.querySelectorAll('script[type="module"]');
    for (var i = 0; i < scripts.length; i++) {
      if (scripts[i].textContent.indexOf("runMermaid") !== -1) {
        scripts[i].setAttribute("data-no-instant", "");
      }
    }
  });
  InstantClick.on("change", function (isInitialLoad) {
    if (isInitialLoad) return;
    laminRenderMermaid();
  });
  InstantClick.init();
</script>
